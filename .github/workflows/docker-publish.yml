name: Publish image

# Publishes the app image to GHCR — but only after the test suite passes:
#   - push to main           -> :latest  (+ :sha-<short>)
#   - push a tag like v1.2.3 -> :v1.2.3   (pinned release for customers)
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Quality gate: the image build below `needs` this, so a red suite blocks any
  # publish. Runs serially (--runInBand) for deterministic, contention-free CI.
  test:
    runs-on: ubuntu-latest
    # A throwaway Postgres for the integration suites (__tests__/integration/*.pg.test.js),
    # which skip unless MEMEX_TEST_PG_URL is set and refuse any database whose name
    # lacks "test". They drop and recreate the schema, so they run one after another.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: memex_ci_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d memex_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MEMEX_TEST_PG_URL: postgres://postgres@localhost:5432/memex_ci_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run tests
        working-directory: server
        run: npm test -- --ci --runInBand

  build-and-push:
    needs: test
    # Don't publish on pull_request events (no push to GHCR for PRs / forks);
    # only real pushes to main and release tags produce an image.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/memex
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
