# clamd, as Depot runs it (the `clamav` service in docker-compose.yml). The app sends every
# upload over TCP with INSTREAM; nothing is scanned from disk, so no path is shared.
LogFile /var/log/clamav/clamd.log
LogTime yes
LogFileMaxSize 20M
PidFile /run/clamav/clamd.pid
TemporaryDirectory /tmp
DatabaseDirectory /var/lib/clamav
LocalSocket /run/clamav/clamd.sock
TCPSocket 3310
# Only the compose network reaches this; the port is never published on the host.
TCPAddr 0.0.0.0
User clamav
Foreground yes
SelfCheck 3600
ConcurrentDatabaseReload yes
# The whole stream sits in memory while it is scanned, so this is the real ceiling.
# Above it clamd answers ERROR and the app refuses the upload. Keep it above the
# app's own cap (Settings: files over malware_scan_max_mb, 512 MB by default, are
# stored unscanned).
StreamMaxLength 1024M
MaxFileSize 1024M
MaxScanSize 2048M
MaxRecursion 16
MaxFiles 10000
# Office files and PDFs are what a CPA office receives; both are opened.
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
ScanHTML yes
ScanXMLDOCS yes
ScanHWP3 yes
ScanMail yes
ScanArchive yes
AlertEncrypted no
Bytecode yes
